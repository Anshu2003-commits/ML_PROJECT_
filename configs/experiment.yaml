# Experiment config. Every date, horizon and grid value lives here, not in code.
# Series coverage was checked on FRED on 2026-11-09 (see docs/data_dictionary.md).

data:
  raw_dir: data/raw
  processed_dir: data/processed
  start: 1994-04-01           # first month of the panel (same as the base paper)
  end: null                   # null = last month where every series has data
  target: EXINUS              # INR per USD, monthly average
  fx_daily: DEXINUS           # daily rate; only for the end-of-month robustness check
  series:                     # variable -> FRED ID per country
    cpi:      {us: CPIAUCSL,        in: INDCPIALLMINMEI}
    ip:       {us: INDPRO,          in: INDPROINDMISMEI}   # India IP ends 2023-01 (binding constraint)
    rate:     {us: FEDFUNDS,        in: IRSTCI01INM156N}
    m3:       {us: MABMM301USM189S, in: MABMM301INM189N}   # India: NSA series (SA version ends 2018-12)
    reserves: {us: TRESEGUSM052N,   in: TRESEGINM052N}
    equity:   {us: SPASTT01USM661N, in: SPASTT01INM661N}
    exports:  {us: XTEXVA01USM667S, in: XTEXVA01INM667S}
    imports:  {us: XTIMVA01USM667S, in: XTIMVA01INM667S}

experiments:
  replication:                # mirrors the base paper's split
    train_end: 2016-07-01
    test_start: 2016-08-01
    test_end: 2018-12-01
    horizons: [1]
  walk_forward:
    first_origin: 2010-01-01
    refit_every_months: 12
    horizons: [1, 3, 6]
  publication_lag_months: [0, 1, 2]   # robustness check

features:
  max_lags: 12                # lags built for every model; models pick what they need (AR picks p <= 12)

feature_sets: [fx_only, fx_plus_macro]

models:
  random_walk: {}
  ar: {max_lag: 12, criterion: aic}
  var: {max_lag: 6, criterion: aic}
  vecm: {max_lag: 6, deterministic: co, signif: 0.05}
  svr:
    C: [1, 10, 100, 1000]
    gamma: [0.0001, 0.001, 0.01]
    epsilon: [0.001, 0.01, 0.1]
  lstm:
    lookback: [6, 12]
    hidden_units: [16, 32]
    dropout: 0.2
    max_epochs: 300
    patience: 20
    seeds: [0, 1, 2, 3, 4]
