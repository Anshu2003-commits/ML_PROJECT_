[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxforecast"
version = "0.1.0"
description = "USD/INR forecasting with macroeconomic indicators: VAR vs SVR vs LSTM"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access to FRED (deselect with -m 'not network')"]
